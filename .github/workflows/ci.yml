name: CI & Native Script Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  powershell-checks:
    name: PowerShell Validation on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell Syntax (AST)
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            Write-Host "Validating $($_.Name)..."
            $tokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              Write-Error "Syntax errors in $($_.Name): $parseErrors"
              $errors++
            } else {
              Write-Host "  [OK] $($_.Name) syntax is valid."
            }
          }
          if ($errors -gt 0) { exit 1 }

      - name: Test PowerShell Dry-Run Execution
        shell: pwsh
        run: |
          .\Claude-Reset.ps1 -DryRun -Auto

  bash-checks:
    name: Bash Validation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash Syntax
        run: |
          bash -n claude-reset.sh
          echo "claude-reset.sh syntax is valid."

      - name: Test Bash Help & Dry-Run Execution
        run: |
          chmod +x claude-reset.sh
          ./claude-reset.sh --help
          ./claude-reset.sh --dry-run --auto
