name: Python CI & Cross-Platform Tests

on:
  push:
    branches: [ "python" ]
  pull_request:
    branches: [ "python" ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate syntax compilation
        run: |
          python -m py_compile claude_reset.py
          python -m py_compile claude_reset_gui.py
          python -m py_compile test_claude_reset.py

      - name: Run unit test suite
        run: |
          python -m unittest test_claude_reset.py -v

      - name: Test CLI arguments
        run: |
          python claude_reset.py --help
          python claude_reset.py --status
          python claude_reset.py --safe --dry-run
