name: Feature Request
description: Suggest an idea or new telemetry identifier to handle
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a feature request or discovered a new telemetry file in Claude CLI/Desktop? Let us know!
  - type: textarea
    id: description
    attributes:
      label: Description of Feature / Telemetry File
      description: What would you like to see added?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / File Path
      description: If this relates to a specific file or registry key, provide the path and sample content.
